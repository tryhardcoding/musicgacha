name: Daily Top200 Update

on:
  schedule:
    # 毎日 20:00 UTC = JST 05:00
    - cron: '0 20 * * *'
  workflow_dispatch: # 手動実行も可能
  push:
    paths:
      - '.github/workflows/daily-update.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch Top200 data
        run: node scripts/fetch-kworb-top200.js

      - name: Merge Top200 to packs
        run: node scripts/merge-top200-to-packs.js

      - name: Assign rarity
        run: node scripts/assign-rarity.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: daily Top200 update $(date -u +%Y-%m-%d)"
          git push
